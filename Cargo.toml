[package]
name = "bletherneuk"
version = "0.1.0"
edition = "2024"
description = "Keeps Claude Code chats in order inside iTerm2: work blocks, live status and per-turn changes."
license = "MIT"
readme = "README.md"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "blether"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock"] }
clap = { version = "4.6.7", features = ["derive"] }
git2 = { version = "0.21.0", default-features = false, features = ["vendored-libgit2"] }
libc = "0.2.191"
notify = "8.2.0"
rand = "0.10.3"
regex = "1.13.1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
rust-embed = "8.13.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
toml = "1.1.8"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
