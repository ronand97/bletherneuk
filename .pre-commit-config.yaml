# Secret scanning before each commit. Needs `gitleaks` on PATH (brew install gitleaks).
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e # v8.30.1
    hooks:
      - id: gitleaks-system
        pass_filenames: false # it scans the staged changes itself
