version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    ignore:
      # svelte-check 4 doesn't support TypeScript 7 yet.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
  - package-ecosystem: pip
    directory: /bridge
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
